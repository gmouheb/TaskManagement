<script>
        // Simple Timer Logic
        let timeLeft = 1500; // 25 mins
        let timerId = null;
        let isRunning = false;
        const totalTime = 1500;

        const display = document.getElementById('timer-display');
        const ring = document.getElementById('timer-ring');
        const startBtn = document.getElementById('start-pause-btn');
        const btnIcon = document.getElementById('btn-icon');
        const btnText = document.getElementById('btn-text');
        const resetBtn = document.getElementById('reset-btn');

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            // Update Ring
            const offset = 301.6 - (timeLeft / totalTime) * 301.6;
            ring.style.strokeDashoffset = offset;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                btnIcon.textContent = 'play_arrow';
                btnText.textContent = 'Resume Focus';
            } else {
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        alert('Focus session complete!');
                    }
                }, 1000);
                btnIcon.textContent = 'pause';
                btnText.textContent = 'Pause';
            }
            isRunning = !isRunning;
        }

        startBtn.addEventListener('click', toggleTimer);
        
        resetBtn.addEventListener('click', () => {
            clearInterval(timerId);
            isRunning = false;
            timeLeft = 1500;
            updateDisplay();
            btnIcon.textContent = 'play_arrow';
            btnText.textContent = 'Start Focus';
        });

        // Mode Switching UI Interaction
        const modes = ['mode-focus', 'mode-short', 'mode-long'];
        modes.forEach(id => {
            document.getElementById(id).addEventListener('click', (e) => {
                modes.forEach(m => {
                    const el = document.getElementById(m);
                    el.classList.remove('bg-primary', 'text-on-primary');
                    el.classList.add('text-on-surface-variant', 'hover:bg-surface-variant/50');
                });
                e.target.classList.add('bg-primary', 'text-on-primary');
                e.target.classList.remove('text-on-surface-variant', 'hover:bg-surface-variant/50');
                
                // Set times
                if(id === 'mode-focus') timeLeft = 1500;
                else if(id === 'mode-short') timeLeft = 300;
                else timeLeft = 900;
                
                clearInterval(timerId);
                isRunning = false;
                updateDisplay();
                btnIcon.textContent = 'play_arrow';
                btnText.textContent = id === 'mode-focus' ? 'Start Focus' : 'Start Break';
            });
        });

        updateDisplay();
    </script>
